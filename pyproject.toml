[project]
name = "file-organizer"
version = "0.1.0"
description = "Agentic receipt organizer using a local LLM"
requires-python = ">=3.11"
dependencies = [
    "langchain>=0.2.0",
    "langchain-ollama>=0.1.0",
    "langchain-community>=0.2.0",
    "pdfplumber>=0.11.0",
    "python-docx>=1.1.0",
    "openlit>=1.32.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-exporter-otlp-proto-http>=1.25.0",
    "opentelemetry-instrumentation-langchain>=0.37.0",
]

[project.scripts]
organize = "main:main"

[tool.uv]
dev-dependencies = [
    "pytest>=8.0.0",
    "pytest-mock>=3.14.0",
]
